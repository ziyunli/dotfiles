# Work omp config (Instacart Tally gateway).
# Tracked source for ~/.omp/agent/config.yml on this device only.
# The gateway itself (providers, endpoints, headers) is Instacart-managed in
# ~/.omp/agent/models.yml and stays out of this repo.
#
# Model policy (provider-diverse baseline roles). Every role's purpose and real
# session trigger, plus the baseline-reasoning alternative preset, are documented
# in OMP_MODELS.md at the repository root:
#   - DeepSeek v4.1 Flash: conversation and task-subagent execution lane
#   - GLM 5.3 Flash: cheap/quick lane and first availability fallback
#   - GPT 6 Luna: narrow low-effort lanes (titles, commit) plus task recovery
#   - Sol 6.1 / Opus 5.5: slow, plan, designer, and advisor lanes
# With a plan in hand, delegate implementation to task subagents: they resolve
# modelRoles.task (DeepSeek first) instead of the conversation model.

symbolPreset: unicode
theme:
  dark: anthracite
  light: light
setupVersion: 3
startup:
  setupWizard: false
  checkUpdate: false

enabledModels:
  - instacart-openai/gpt-5.6-terra
  - instacart-openai/gpt-5.6-luna
  - instacart-openai/gpt-5.6-sol
  - instacart-openai/gpt-6.1-sol
  - instacart-openai/gpt-6-sol
  - instacart-openai/gpt-6-luna
  - instacart-openai-decisions/gpt-6-luna
  - open-weights/glm-5.3-priority
  - open-weights/glm-5.3-flash-priority
  - open-weights/deepseek-v4p1-flash-priority
  - open-weights/minimax-latest-priority
  - open-weights/Griffin/Qwen3.8-27B-NVFP4
  - open-weights/qwen-latest-priority
  - vertex-proxy/gemini-3.7-flash
  - vertex-proxy/gemini-3.8-flash
  - instacart-anthropic/claude-opus-4-7@default
  - instacart-anthropic/claude-opus-4-8@default
  - instacart-anthropic/claude-opus-5-5@default
  - instacart-anthropic/claude-sonnet-4-6@default
  - instacart-anthropic/claude-sonnet-5-5@default
  - instacart-anthropic/claude-haiku-4-5@20251001

# Active roles equal the provider-diverse preset below: one primary selector per
# role, with request-failure recovery owned by retry.fallbackChains.
modelRoles:
  default: open-weights/deepseek-v4p1-flash-priority:high
  task: open-weights/deepseek-v4p1-flash-priority:high
  smol: open-weights/glm-5.3-flash-priority:high
  tiny: instacart-openai/gpt-6-luna:low
  commit: instacart-openai/gpt-6-luna:low
  slow: instacart-openai/gpt-6.1-sol:high
  plan: instacart-anthropic/claude-opus-5-5@default:high
  designer: instacart-openai/gpt-6.1-sol:high
  vision: vertex-proxy/gemini-3.8-flash:medium
  advisor: instacart-openai/gpt-6.1-sol:high
  judge: instacart-openai-decisions/gpt-6-luna

# Named snapshots for /modelpreset switch. A preset captures modelRoles and
# defaultThinkingLevel only: retry chains, advisor flags, and title/memory
# settings are not swapped. provider-diverse is the active mapping above.
modelPresets:
  provider-diverse:
    modelRoles:
      default: open-weights/deepseek-v4p1-flash-priority:high
      task: open-weights/deepseek-v4p1-flash-priority:high
      smol: open-weights/glm-5.3-flash-priority:high
      tiny: instacart-openai/gpt-6-luna:low
      commit: instacart-openai/gpt-6-luna:low
      slow: instacart-openai/gpt-6.1-sol:high
      plan: instacart-anthropic/claude-opus-5-5@default:high
      designer: instacart-openai/gpt-6.1-sol:high
      vision: vertex-proxy/gemini-3.8-flash:medium
      advisor: instacart-openai/gpt-6.1-sol:high
      judge: instacart-openai-decisions/gpt-6-luna
    defaultThinkingLevel: high
  baseline-reasoning:
    modelRoles:
      default: open-weights/deepseek-v4p1-flash-priority:high
      task: instacart-openai/gpt-6-luna:xhigh
      smol: open-weights/glm-5.3-flash-priority:high
      tiny: open-weights/glm-5.3-flash-priority:low
      commit: instacart-openai/gpt-6-luna:low
      slow: instacart-openai/gpt-6.1-sol:high
      plan: instacart-openai/gpt-6.1-sol:high
      designer: instacart-openai/gpt-6.1-sol:high
      vision: instacart-openai/gpt-6-luna:xhigh
      advisor: instacart-openai/gpt-6.1-sol:medium
      judge: instacart-openai-decisions/gpt-6-luna
    defaultThinkingLevel: high


task:
  agentModelOverrides:
    security-reviewer: "@slow"
retry:
  fallbackChains:
    task:
      - open-weights/glm-5.3-flash-priority:high
      - instacart-openai/gpt-6-luna:high
      - instacart-openai/gpt-5.6-luna:high
    smol:
      - instacart-openai/gpt-6-luna:high
      - instacart-openai/gpt-5.6-luna:high
    commit:
      - open-weights/glm-5.3-flash-priority:low
    tiny:
      - open-weights/glm-5.3-flash-priority:low
    judge: []

# Advisor runtime stays off; enable it per session with /advisor on or --advisor.
advisor:
  enabled: false

defaultThinkingLevel: high

# Consent flag written by omp's automated tool-issue reporting prompt; kept so a
# relink never re-prompts. Personal devices can set their own value locally.
dev:
  autoqaConsent: granted

hideThinkingBlock: false
colorBlindMode: false
composer:
  shape: box
statusLine:
  compactThinkingLevel: false
  preset: custom
  leftSegments:
    - pi
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
  rightSegments:
    - session_name
