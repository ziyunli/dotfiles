# Set the default terminal mode to 256color mode.
# Prefer tmux-256color but fall back to screen-256color if the terminfo entry
# is missing (common on macOS with Homebrew tmux).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Report modified keys such as Shift-Enter to terminal apps inside tmux.
set -g extended-keys on
# Use CSI-u encoding for modified keys; Pi expects this format inside tmux.
set -g extended-keys-format csi-u
# Declare that the parent terminal can SEND extended keys. extended-keys (above)
# only covers tmux->app; without this upstream feature, nested tmux breaks
# Shift-Enter: the inner tmux sees TERM=tmux-256color, which has no extkeys by
# default, so it never requests CSI-u from the outer tmux and the key collapses
# to a plain CR. The "*" glob covers both the outer (xterm-ghostty) and inner
# (tmux-256color) hops. Option-Enter is unaffected because it uses the legacy
# ESC+CR meta encoding that needs no protocol negotiation.
set -as terminal-features '*:extkeys'

# Enable OSC52 clipboard support (needed for apps like Claude Code over SSH/tmux).
# NOTE: set-clipboard is a server option (-s); changes require a full server
# restart (tmux kill-server) — reloading with C-a r is not sufficient.
# NOTE: with set-clipboard=on, any app writing to a pane can set the system
# clipboard. Use "external" instead if untrusted workloads share this server.
set -s set-clipboard on
# allow-passthrough requires tmux 3.3+; no-op on older versions
if-shell 'tmux set -g allow-passthrough on 2>/dev/null' ''

# Refresh Ghostty integration variables when attaching to an existing tmux server.
set -ag update-environment GHOSTTY_BIN_DIR
set -ag update-environment GHOSTTY_RESOURCES_DIR
set -ag update-environment GHOSTTY_SHELL_FEATURES
set -ag update-environment TERM_PROGRAM
set -ag update-environment TERM_PROGRAM_VERSION
set -ag update-environment COLORTERM

# set the status line's colors
set -g status-style fg=white,bg=black
# set the color of the window list
setw -g window-status-style fg=cyan,bg=black
# set colors for the active window
setw -g window-status-current-style fg=white,bold,bg=red
# colors for pane borders
setw -g pane-border-style fg=green,bg=black
setw -g pane-active-border-style fg=white,bg=yellow
# active pane normal, other shaded out
setw -g window-style fg=colour240,bg=colour235
setw -g window-active-style fg=white,bg=black
# Command / message line
set -g message-style fg=white,bold,bg=black
# Popup style (high contrast) - requires tmux 3.4+
if-shell 'tmux -V | awk "{split(\$2,v,\".\"); if (v[1]>3 || (v[1]==3 && v[2]>=4)) exit 0; else exit 1}"' \
  'set -g popup-style fg=white,bg=black; set -g popup-border-style fg=yellow,bg=black'

# Status line left side to show Session:window:pane​
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
# Status line right side -  31-Oct 13:37
set -g status-right "#[fg=cyan]%d %b %R"
# Update the status line every sixty seconds
set -g status-interval 60
# Center the window list in the status line
set -g status-justify centre
# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# mouse support - set to on if you want to use the mouse
set -g mouse on

# Setting the prefix from C-b to C-a
set -g prefix C-a
# Free the original Ctrl-b prefix keybinding
unbind C-b
#setting the delay between prefix and command
set -s escape-time 1
# Set the base index for windows to 1 instead of 0
set -g base-index 1
# Set the base index for panes to 1 instead of 0
setw -g pane-base-index 1

# Reload the file with Prefix r
bind r source-file ~/.tmux.conf \; display "Conf Reloaded!"
# Ensure that we can send Ctrl-A to other apps (by pressing Ctrl-a twice)
bind C-a send-prefix

# splitting panes with | and -
bind | split-window -h
bind - split-window -v
# moving between panes with Prefix h,j,k,l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Quick window selection
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
# Pane resizing panes with Prefix H,J,K,L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key -n M-p run-shell "\
  tmux display-popup -E -w 80% -h 80% '\
    cd #{pane_current_path} && \
    selected=\$(fd --type f | fzf --bind \"ctrl-g:reload(fd --type f --no-ignore)+change-prompt(no-ignore> )\" --bind \"ctrl-h:reload(fd --type f)+change-prompt(> )\" --prompt \"> \" --preview-window=right:60%:wrap --preview \"if command -v bat >/dev/null 2>&1; then bat --style=plain --color=always --line-range :500 {}; else cat {}; fi\"); \
    tmux send-keys -t #{pane_id} \"\$selected\"' \
"
